{% extends "base.html" %}
{% block title %}{{ page_title }} | Smart Inventory{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ page_title }}</h1>
<div class="card form-card"><div class="card-body">
<form method="post" class="row g-3">
<div class="col-md-4"><label class="form-label">Store ID</label><input class="form-control" name="store_id" maxlength="30" value="{{ product.store_id if product else 'MAIN' }}" required></div>
<div class="col-md-4"><label class="form-label">Product code / ID</label><input class="form-control" name="product_code" maxlength="60" value="{{ product.product_code if product else '' }}" required></div>
<div class="col-md-4"><label class="form-label">Product name</label><input class="form-control" name="product_name" maxlength="160" value="{{ product.product_name if product else '' }}" required></div>
<div class="col-md-4"><label class="form-label">Category</label><input class="form-control" name="category" value="{{ product.category if product else '' }}"></div>
<div class="col-md-4"><label class="form-label">Quantity</label><input class="form-control" type="number" min="0" name="quantity" value="{{ product.quantity if product else 0 }}" required></div>
<div class="col-md-4"><label class="form-label">Reorder level</label><input class="form-control" type="number" min="0" name="reorder_level" value="{{ product.reorder_level if product else 10 }}" required></div>
<div class="col-md-4"><label class="form-label">Unit price</label><input class="form-control" type="number" min="0" step="0.01" name="unit_price" value="{{ product.unit_price if product else 0 }}" required></div>
<div class="col-12"><button class="btn btn-primary">Save product</button> <a class="btn btn-outline-secondary" href="{{ url_for('products') }}">Cancel</a></div>
</form></div></div>
{% endblock %}
